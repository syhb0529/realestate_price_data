<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아파트 실거래 조회</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --line: #d9e0ea;
      --text: #1f2937;
      --muted: #6b7280;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --red: #dc2626;
      --green: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .title { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .field input, .field select {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      background: white;
    }
    .actions {
      display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 14px;
    }
    button {
      height: 42px;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--blue);
      color: white;
    }
    button.secondary { background: #475569; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .warn { color: var(--red); }
    .ok { color: var(--green); }
    .summary {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
    }
    details.group {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 10px;
      background: #fff;
      overflow: hidden;
    }
    details.group[open] { border-color: #bfd3ff; }
    details.group > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    details.group > summary::-webkit-details-marker { display: none; }
    .s-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .arrow {
      width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      background: #eef2ff; color: #4338ca; font-size: 12px; flex: 0 0 auto;
    }
    details[open] .arrow { transform: rotate(90deg); }
    .apt-name { font-size: 16px; font-weight: 700; }
    .apt-meta { color: var(--muted); font-size: 13px; }
    .s-right { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #f1f5f9; color: #334155;
    }
    .badge.red { background: #fef2f2; color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 10px 12px; border-top: 1px solid var(--line); text-align: left; font-size: 14px; vertical-align: middle;
    }
    th { background: #f8fafc; color: #475569; font-weight: 700; }
    .price { font-weight: 700; }
    .cancel { color: var(--red); font-weight: 700; margin-left: 4px; }
    .small { font-size: 12px; color: var(--muted); }
    .footer-note { font-size: 13px; color: var(--muted); line-height: 1.5; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      details.group > summary { flex-direction: column; align-items: flex-start; }
      .s-right { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">아파트 실거래 조회</h1>
    <p class="sub">월 단위 조회 후 계약일 기준으로 일별 필터를 적용합니다. 조회할 때마다 API를 다시 호출합니다.</p>

    <div class="card">
      <div class="grid">
        <div class="field" style="grid-column: span 2;">
          <label for="serviceKey">공공데이터 서비스키</label>
          <input id="serviceKey" type="text" placeholder="서비스키를 입력하세요" />
        </div>
        <div class="field">
          <label for="sido">시/도</label>
          <select id="sido"></select>
        </div>
        <div class="field">
          <label for="sigungu">시군구</label>
          <select id="sigungu"></select>
        </div>
        <div class="field">
          <label for="dealYmd">계약년월</label>
          <input id="dealYmd" type="month" />
        </div>
        <div class="field">
          <label for="dealDay">계약일</label>
          <select id="dealDay">
            <option value="">전체</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="searchBtn">실거래 조회</button>
        <button id="sampleBtn" class="secondary">샘플 데이터 보기</button>
      </div>
      <div id="message" class="msg"></div>
    </div>

    <div id="resultCard" class="card" style="display:none;">
      <div class="summary" id="summary"></div>
      <div id="result"></div>
    </div>

    <div class="card footer-note">
      <div>표시 규칙</div>
      <div>- 해제 거래는 가격 옆에 <strong>(해제)</strong>로 표시</div>
      <div>- 같은 단지는 하나로 묶고, 화살표 클릭 시 세부 거래 목록 표시</div>
      <div>- 계약년월은 API 기준 월 조회, 계약일은 받은 결과 안에서 필터링</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade';

    const regions = {
      '서울특별시': [
        { name: '강남구', code: '11680' }, { name: '강동구', code: '11740' }, { name: '강북구', code: '11305' },
        { name: '강서구', code: '11500' }, { name: '관악구', code: '11620' }, { name: '광진구', code: '11215' },
        { name: '구로구', code: '11530' }, { name: '금천구', code: '11545' }, { name: '노원구', code: '11350' },
        { name: '도봉구', code: '11320' }, { name: '동대문구', code: '11230' }, { name: '동작구', code: '11590' },
        { name: '마포구', code: '11440' }, { name: '서대문구', code: '11410' }, { name: '서초구', code: '11650' },
        { name: '성동구', code: '11200' }, { name: '성북구', code: '11290' }, { name: '송파구', code: '11710' },
        { name: '양천구', code: '11470' }, { name: '영등포구', code: '11560' }, { name: '용산구', code: '11170' },
        { name: '은평구', code: '11380' }, { name: '종로구', code: '11110' }, { name: '중구', code: '11140' },

      '경기도': [
        { name: '가평군', code: '41820' }, { name: '고양덕양구', code: '41281' }, { name: '고양일산동구', code: '41285' },
        { name: '고양일산서구', code: '41287' }, { name: '과천시', code: '41290' }, { name: '광명시', code: '41210' },
        { name: '광주시', code: '41610' }, { name: '구리시', code: '41310' }, { name: '군포시', code: '41410' },
        { name: '김포시', code: '41570' }, { name: '남양주시', code: '41360' }, { name: '동두천시', code: '41250' },
        { name: '부천시', code: '41190' }, { name: '성남분당구', code: '41135' }, { name: '성남수정구', code: '41131' },
        { name: '성남중원구', code: '41133' }, { name: '수원권선구', code: '41113' }, { name: '수원영통구', code: '41117' },
        { name: '수원장안구', code: '41111' }, { name: '수원팔달구', code: '41115' }, { name: '시흥시', code: '41390' },
        { name: '안산단원구', code: '41273' }, { name: '안산상록구', code: '41271' }, { name: '안성시', code: '41550' },
        { name: '안양동안구', code: '41173' }, { name: '안양만안구', code: '41171' }, { name: '양주시', code: '41630' },
        { name: '양평군', code: '41830' }, { name: '여주시', code: '41670' }, { name: '연천군', code: '41800' },
        { name: '오산시', code: '41370' }, { name: '용인기흥구', code: '41463' }, { name: '용인수지구', code: '41465' },
        { name: '용인처인구', code: '41461' }, { name: '의왕시', code: '41430' }, { name: '의정부시', code: '41150' },
        { name: '이천시', code: '41500' }, { name: '파주시', code: '41480' }, { name: '평택시', code: '41220' },
        { name: '포천시', code: '41650' }, { name: '하남시', code: '41450' }, { name: '화성시', code: '41590' }
      ],
      '인천광역시': [
        { name: '계양구', code: '28245' }, { name: '남동구', code: '28200' }, { name: '동구', code: '28140' },
        { name: '미추홀구', code: '28177' }, { name: '부평구', code: '28237' }, { name: '서구', code: '28260' },
        { name: '연수구', code: '28185' }, { name: '중구', code: '28110' }
      ],
      '부산광역시': [
        { name: '강서구', code: '26440' }, { name: '금정구', code: '26410' }, { name: '기장군', code: '26710' },
        { name: '남구', code: '26290' }, { name: '동구', code: '26170' }, { name: '동래구', code: '26260' },
        { name: '부산진구', code: '26230' }, { name: '북구', code: '26320' }, { name: '사상구', code: '26530' },
        { name: '사하구', code: '26380' }, { name: '서구', code: '26140' }, { name: '수영구', code: '26500' },
        { name: '연제구', code: '26470' }, { name: '영도구', code: '26200' }, { name: '중구', code: '26110' },
        { name: '해운대구', code: '26350' }
      ],
      '대구광역시': [
        { name: '남구', code: '27200' }, { name: '달서구', code: '27290' }, { name: '달성군', code: '27710' },
        { name: '동구', code: '27140' }, { name: '북구', code: '27230' }, { name: '서구', code: '27170' },
        { name: '수성구', code: '27260' }, { name: '중구', code: '27110' }
      ]
    };

    const sampleItems = [
      { aptNm:'광명역써밋플레이스', aptDong:'101동', excluUseAr:'84.97', floor:'21', dealAmount:'93,000', dealYear:'2026', dealMonth:'4', dealDay:'1', buildYear:'2017', dealingGbn:'중개거래', cdealType:'', cdealDay:'', estateAgentSggNm:'경기 광명시' },
      { aptNm:'광명역써밋플레이스', aptDong:'103동', excluUseAr:'84.97', floor:'14', dealAmount:'91,500', dealYear:'2026', dealMonth:'4', dealDay:'1', buildYear:'2017', dealingGbn:'중개거래', cdealType:'O', cdealDay:'20260409', estateAgentSggNm:'경기 광명시' },
      { aptNm:'철산래미안자이', aptDong:'209동', excluUseAr:'59.99', floor:'9', dealAmount:'78,000', dealYear:'2026', dealMonth:'4', dealDay:'1', buildYear:'2009', dealingGbn:'직거래', cdealType:'', cdealDay:'', estateAgentSggNm:'경기 광명시' },
      { aptNm:'철산래미안자이', aptDong:'', excluUseAr:'84.98', floor:'18', dealAmount:'102,000', dealYear:'2026', dealMonth:'4', dealDay:'7', buildYear:'2009', dealingGbn:'중개거래', cdealType:'', cdealDay:'', estateAgentSggNm:'경기 광명시' }
    ];

    const serviceKeyEl = document.getElementById('serviceKey');
    const sidoEl = document.getElementById('sido');
    const sigunguEl = document.getElementById('sigungu');
    const dealYmdEl = document.getElementById('dealYmd');
    const dealDayEl = document.getElementById('dealDay');
    const msgEl = document.getElementById('message');
    const resultEl = document.getElementById('result');
    const resultCardEl = document.getElementById('resultCard');
    const summaryEl = document.getElementById('summary');
    const searchBtn = document.getElementById('searchBtn');
    const sampleBtn = document.getElementById('sampleBtn');

    let lastItems = [];

    function setDefaultMonth() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      dealYmdEl.value = `${now.getFullYear()}-${month}`;
    }

    function populateSido() {
      sidoEl.innerHTML = '';
      Object.keys(regions).forEach((name, index) => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        if (index === 1) opt.selected = true; // 경기도 기본
        sidoEl.appendChild(opt);
      });
      populateSigungu();
    }

    function populateSigungu() {
      const sido = sidoEl.value;
      sigunguEl.innerHTML = '';
      (regions[sido] || []).forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = item.code;
        opt.textContent = item.name;
        if (sido === '경기도' && item.name === '광명시') opt.selected = true;
        else if (index === 0 && !Array.from(sigunguEl.options).some(o => o.selected)) opt.selected = true;
        sigunguEl.appendChild(opt);
      });
    }

    function populateDayOptions(items) {
      const prev = dealDayEl.value;
      const days = [...new Set(items.map(v => Number(v.dealDay)).filter(Boolean))].sort((a,b) => a-b);
      dealDayEl.innerHTML = '<option value="">전체</option>';
      days.forEach(day => {
        const opt = document.createElement('option');
        opt.value = String(day);
        opt.textContent = `${day}일`;
        if (String(day) === prev) opt.selected = true;
        dealDayEl.appendChild(opt);
      });
    }

    function setMessage(text, type='') {
      msgEl.className = `msg ${type}`;
      msgEl.textContent = text;
    }

    function xmlText(parent, tag) {
      const node = parent.querySelector(tag);
      return node ? (node.textContent || '').trim() : '';
    }

    function parseXml(xmlString) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlString, 'text/xml');
      const resultCode = xmlText(xml, 'resultCode');
      const resultMsg = xmlText(xml, 'resultMsg');
      if (resultCode && resultCode !== '000') {
        throw new Error(`${resultCode} ${resultMsg || 'API 오류'}`);
      }
      return [...xml.querySelectorAll('item')].map(item => ({
        aptNm: xmlText(item, 'aptNm'),
        aptDong: xmlText(item, 'aptDong'),
        excluUseAr: xmlText(item, 'excluUseAr'),
        floor: xmlText(item, 'floor'),
        dealAmount: xmlText(item, 'dealAmount'),
        dealYear: xmlText(item, 'dealYear'),
        dealMonth: xmlText(item, 'dealMonth'),
        dealDay: xmlText(item, 'dealDay'),
        buildYear: xmlText(item, 'buildYear'),
        dealingGbn: xmlText(item, 'dealingGbn'),
        cdealType: xmlText(item, 'cdealType'),
        cdealDay: xmlText(item, 'cdealDay'),
        estateAgentSggNm: xmlText(item, 'estateAgentSggNm')
      }));
    }

    function formatDate(item) {
      return `${item.dealYear}.${String(item.dealMonth).padStart(2, '0')}.${String(item.dealDay).padStart(2, '0')}`;
    }

    function isCancelled(item) {
      return !!(item.cdealType && item.cdealType.trim());
    }

    function formatAmount(v) {
      const clean = String(v || '').replace(/,/g, '');
      const num = Number(clean);
      return Number.isFinite(num) ? num.toLocaleString('ko-KR') + '만원' : (v || '');
    }

    function groupItems(items) {
      const grouped = new Map();
      items.forEach(item => {
        const key = item.aptNm || '이름없음';
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(item);
      });
      return [...grouped.entries()].map(([aptNm, rows]) => {
        rows.sort((a,b) => {
          const ad = Number(a.dealDay || 0), bd = Number(b.dealDay || 0);
          if (ad !== bd) return ad - bd;
          return (a.aptDong || '').localeCompare(b.aptDong || '');
        });
        const cancelledCount = rows.filter(isCancelled).length;
        const areaSet = [...new Set(rows.map(r => r.excluUseAr).filter(Boolean))];
        return { aptNm, rows, count: rows.length, cancelledCount, areas: areaSet };
      }).sort((a,b) => a.aptNm.localeCompare(b.aptNm, 'ko'));
    }

    function render(items) {
      const dayFilter = dealDayEl.value;
      const filtered = dayFilter ? items.filter(v => String(Number(v.dealDay)) === String(Number(dayFilter))) : items;
      populateDayOptions(items);
      resultCardEl.style.display = 'block';
      summaryEl.innerHTML = '';
      resultEl.innerHTML = '';

      const total = filtered.length;
      const cancelled = filtered.filter(isCancelled).length;
      const groups = groupItems(filtered);
      const lawdName = sigunguEl.options[sigunguEl.selectedIndex]?.text || '';
      const monthText = dealYmdEl.value ? dealYmdEl.value.replace('-', '.') : '';

      [
        `지역: ${sidoEl.value} ${lawdName}`,
        `계약년월: ${monthText}`,
        `계약일: ${dayFilter ? dayFilter + '일' : '전체'}`,
        `거래건수: ${total}건`,
        `해제표시건수: ${cancelled}건`
      ].forEach(text => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = text;
        summaryEl.appendChild(chip);
      });

      if (!filtered.length) {
        resultEl.innerHTML = '<div class="msg">조건에 맞는 거래가 없습니다.</div>';
        return;
      }

      groups.forEach(group => {
        const details = document.createElement('details');
        details.className = 'group';
        const summary = document.createElement('summary');
        const areaText = group.areas.length ? `전용 ${group.areas.join(', ')}㎡` : '전용면적 없음';
        summary.innerHTML = `
          <div class="s-left">
            <span class="arrow">▶</span>
            <div>
              <div class="apt-name">${escapeHtml(group.aptNm)}</div>
              <div class="apt-meta">${escapeHtml(areaText)}</div>
            </div>
          </div>
          <div class="s-right">
            <span class="badge">${group.count}건</span>
            ${group.cancelledCount ? `<span class="badge red">해제 ${group.cancelledCount}건</span>` : ''}
          </div>
        `;
        details.appendChild(summary);

        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>계약일</th>
              <th>동</th>
              <th>전용면적</th>
              <th>층</th>
              <th>거래금액</th>
              <th>거래유형</th>
              <th>건축년도</th>
              <th>중개사소재지</th>
            </tr>
          </thead>
          <tbody>
            ${group.rows.map(row => `
              <tr>
                <td>${escapeHtml(formatDate(row))}${isCancelled(row) && row.cdealDay ? `<div class="small">해제일 ${escapeHtml(row.cdealDay)}</div>` : ''}</td>
                <td>${escapeHtml(row.aptDong || '-')}</td>
                <td>${escapeHtml(row.excluUseAr || '-')}</td>
                <td>${escapeHtml(row.floor || '-')}</td>
                <td class="price">${escapeHtml(formatAmount(row.dealAmount))}${isCancelled(row) ? '<span class="cancel">(해제)</span>' : ''}</td>
                <td>${escapeHtml(row.dealingGbn || '-')}</td>
                <td>${escapeHtml(row.buildYear || '-')}</td>
                <td>${escapeHtml(row.estateAgentSggNm || '-')}</td>
              </tr>
            `).join('')}
          </tbody>
        `;
        details.appendChild(table);
        resultEl.appendChild(details);
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function fetchAllPages(serviceKey, lawdCd, dealYmd) {
      let pageNo = 1;
      const numOfRows = 1000;
      let totalCount = null;
      let allItems = [];

      while (true) {
        const url = new URL(API_URL);
        url.searchParams.set('serviceKey', serviceKey);
        url.searchParams.set('LAWD_CD', lawdCd);
        url.searchParams.set('DEAL_YMD', dealYmd);
        url.searchParams.set('pageNo', pageNo);
        url.searchParams.set('numOfRows', numOfRows);

        const response = await fetch(url.toString());
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const xmlTextResp = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlTextResp, 'text/xml');
        const resultCode = xmlText(xml, 'resultCode');
        const resultMsg = xmlText(xml, 'resultMsg');
        if (resultCode && resultCode !== '000') throw new Error(`${resultCode} ${resultMsg || 'API 오류'}`);

        const items = [...xml.querySelectorAll('item')].map(item => ({
          aptNm: xmlText(item, 'aptNm'),
          aptDong: xmlText(item, 'aptDong'),
          excluUseAr: xmlText(item, 'excluUseAr'),
          floor: xmlText(item, 'floor'),
          dealAmount: xmlText(item, 'dealAmount'),
          dealYear: xmlText(item, 'dealYear'),
          dealMonth: xmlText(item, 'dealMonth'),
          dealDay: xmlText(item, 'dealDay'),
          buildYear: xmlText(item, 'buildYear'),
          dealingGbn: xmlText(item, 'dealingGbn'),
          cdealType: xmlText(item, 'cdealType'),
          cdealDay: xmlText(item, 'cdealDay'),
          estateAgentSggNm: xmlText(item, 'estateAgentSggNm')
        }));
        allItems = allItems.concat(items);

        if (totalCount === null) totalCount = Number(xmlText(xml, 'totalCount') || 0);
        if (allItems.length >= totalCount || items.length === 0) break;
        pageNo += 1;
      }
      return allItems;
    }

    async function handleSearch() {
      const serviceKey = serviceKeyEl.value.trim();
      const lawdCd = sigunguEl.value;
      const ym = dealYmdEl.value;
      if (!serviceKey) {
        setMessage('서비스키를 입력하세요.', 'warn');
        return;
      }
      if (!lawdCd || !ym) {
        setMessage('지역과 계약년월을 선택하세요.', 'warn');
        return;
      }
      const dealYmd = ym.replace('-', '');
      searchBtn.disabled = true;
      setMessage('조회 중입니다. API를 다시 호출하고 있습니다...');
      try {
        const items = await fetchAllPages(serviceKey, lawdCd, dealYmd);
        lastItems = items;
        populateDayOptions(items);
        render(items);
        setMessage(`조회 완료: ${items.length}건`, 'ok');
      } catch (err) {
        console.error(err);
        setMessage(`오류: ${err.message}. 직접호출이 차단되면 브라우저나 네트워크 환경 문제일 수 있습니다.`, 'warn');
      } finally {
        searchBtn.disabled = false;
      }
    }

    sidoEl.addEventListener('change', populateSigungu);
    dealDayEl.addEventListener('change', () => render(lastItems));
    searchBtn.addEventListener('click', handleSearch);
    sampleBtn.addEventListener('click', () => {
      lastItems = sampleItems;
      populateDayOptions(sampleItems);
      render(sampleItems);
      setMessage('샘플 데이터를 표시했습니다.', 'ok');
    });

    setDefaultMonth();
    populateSido();
  </script>
</body>
</html>
