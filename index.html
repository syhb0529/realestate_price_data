<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아파트 실거래 조회</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue2: #1d4ed8;
      --red: #dc2626;
      --green: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .hero {
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .sub {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button, select, input {
      font: inherit;
    }
    button {
      background: var(--blue);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: var(--blue2); }
    .btn-secondary {
      background: #eef2ff;
      color: var(--blue2);
      border: 1px solid #c7d2fe;
    }
    .search-box {
      display: grid;
      grid-template-columns: 1fr 160px 140px;
      gap: 10px;
      margin-top: 16px;
    }
    .search-box input, .search-box select,
    .filters select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
    }
    .status {
      margin: 10px 0 0;
      min-height: 22px;
      font-size: 14px;
      color: var(--sub);
    }
    .status.error { color: var(--red); }
    .status.ok { color: var(--green); }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    .metric {
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .metric .label { color: var(--sub); font-size: 12px; }
    .metric .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .group-head {
      display: grid;
      grid-template-columns: 36px 1.4fr 1fr 1fr 110px;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
    }
    .apt-name { font-size: 18px; font-weight: 700; }
    .small { color: var(--sub); font-size: 12px; }
    .chev {
      width: 28px; height: 28px; border-radius: 999px;
      display: grid; place-items: center; background: #eff6ff; color: var(--blue2);
      transition: transform .2s ease;
      font-weight: 700;
    }
    .group.open .chev { transform: rotate(90deg); }
    .details { display: none; border-top: 1px solid var(--line); background: #fcfdff; }
    .group.open .details { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th { background: #f9fafb; color: #374151; }
    .cancel { color: var(--red); font-weight: 700; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      font-size: 12px;
      color: #374151;
    }
    .top-panel {
      margin-bottom: 16px;
    }
    .filters {
      padding: 14px;
    }
    .filters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 150px 120px 160px;
      gap: 10px;
      align-items: end;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .hidden-note {
      font-size: 12px;
      color: var(--sub);
      margin-top: 10px;
    }
    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .search-box { grid-template-columns: 1fr; }
      .filters-grid { grid-template-columns: 1fr 1fr; }
      .group-head { grid-template-columns: 36px 1fr; }
      .group-head > div:nth-child(n+3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>아파트 실거래 조회</h1>
      <div class="sub">
        같은 단지는 하나로 묶고, 화살표를 눌러 세부 거래를 펼쳐봅니다.<br>
        해제 거래는 가격 옆에 <b>(해제)</b>로 표기합니다. 조회할 때마다 API를 다시 호출합니다.
      </div>

      <div class="search-box">
        <input id="aptSearch" type="text" placeholder="단지명 검색" />
        <select id="sortBy">
          <option value="latest">최신 계약일순</option>
          <option value="priceDesc">최고가순</option>
          <option value="priceAsc">최저가순</option>
          <option value="countDesc">거래건수순</option>
        </select>
        <button id="csvBtn" class="btn-secondary" type="button">CSV 다운로드</button>
      </div>

      <div id="status" class="status">상단에서 지역과 년월/일을 고른 뒤 조회하세요.</div>
    </div>

    <div class="top-panel">
      <div class="card filters">
        <div class="filters-grid">
          <div class="field">
            <label for="sido">시/도</label>
            <select id="sido"></select>
          </div>
          <div class="field">
            <label for="sigungu">시군구</label>
            <select id="sigungu"></select>
          </div>
          <div class="field">
            <label for="dealYmd">계약년월</label>
            <select id="dealYmd"></select>
          </div>
          <div class="field">
            <label for="dealDay">계약일</label>
            <select id="dealDay"></select>
          </div>
          <div class="field">
            <button id="loadBtn" type="button" style="width:100%;">실거래 조회</button>
          </div>
        </div>
        <div class="hidden-note">
          서비스키는 개인용으로 HTML 내부에 고정되어 있습니다. 공개 저장소/공개 배포용으로는 권장되지 않습니다.
        </div>
      </div>
    </div>

    <div class="summary">
      <div class="metric"><div class="label">조회 단지 수</div><div id="mAptCount" class="value">0</div></div>
      <div class="metric"><div class="label">조회 거래 수</div><div id="mTradeCount" class="value">0</div></div>
      <div class="metric"><div class="label">해제 거래 수</div><div id="mCancelCount" class="value">0</div></div>
      <div class="metric"><div class="label">현재 지역</div><div id="mRegion" class="value" style="font-size:18px;">-</div></div>
    </div>

    <div id="groupList" class="group-list"></div>

    </div>
  </div>

      '경상남도': { '창원시 의창구': '48121', '창원시 성산구': '48123', '창원시 마산합포구': '48125', '창원시 마산회원구': '48127', '창원시 진해구': '48129', '김해시': '48250', '양산시': '48330', '진주시': '48170' },
      '제주특별자치도': { '제주시': '50110', '서귀포시': '50130' }

    const state = {
      raw: [],
      filtered: [],
      grouped: []
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(msg, cls='') {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status ' + cls;
    }

    function formatMoney(v) {
      const n = Number(String(v).replace(/,/g, ''));
      if (Number.isNaN(n)) return v || '-';
      return n.toLocaleString('ko-KR') + '만원';
    }

    function formatDate(y, m, d) {
      const mm = String(m).padStart(2, '0');
      const dd = String(d).padStart(2, '0');
      return `${y}-${mm}-${dd}`;
    }

    function initYmd() {
      const ymd = $('dealYmd');
      const now = new Date();
      const opts = [];
      for (let i = 0; i < 36; i++) {
        const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const val = `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}`;
        const text = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
        opts.push(`<option value="${val}">${text}</option>`);
      }
      ymd.innerHTML = opts.join('');
      ymd.value = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}`;
    }

    function initDays() {
      const day = $('dealDay');
      let html = '<option value="">전체</option>';
      for (let i = 1; i <= 31; i++) {
        html += `<option value="${i}">${i}일</option>`;
      }
      day.innerHTML = html;
    }

    function populateSido() {
      const sido = $('sido');
      sido.innerHTML = Object.keys(regions).map((name) => `<option value="${name}">${name}</option>`).join('');
      if (regions['경기도']) sido.value = '경기도';
      populateSigungu();
    }

    function populateSigungu() {
      const sidoVal = $('sido').value;
      const target = regions[sidoVal] || {};
      const sigungu = $('sigungu');
      sigungu.innerHTML = Object.keys(target).map((name) => `<option value="${target[name]}">${name}</option>`).join('');
      if (sidoVal === '경기도' && target['광명시']) sigungu.value = target['광명시'];
      updateRegionMetric();
    }

    function selectedRegionName() {
      const sido = $('sido').value;
      const sigunguSel = $('sigungu');
      const sigunguName = sigunguSel.options[sigunguSel.selectedIndex]?.text || '';
      return `${sido} ${sigunguName}`.trim();
    }

    function updateRegionMetric() {
      $('mRegion').textContent = selectedRegionName() || '-';
    }

    async function loadTrades() {
      const lawdCd = $('sigungu').value;
      const dealYmd = $('dealYmd').value;
      const dayFilter = $('dealDay').value;
      if (!lawdCd || !dealYmd) {
        setStatus('지역과 계약년월을 선택하세요.', 'error');
        return;
      }

      setStatus('실거래 데이터를 조회 중입니다...', '');
      const params = new URLSearchParams({
        serviceKey: SERVICE_KEY,
        LAWD_CD: lawdCd,
        DEAL_YMD: dealYmd,
        pageNo: '1',
        numOfRows: '1000'
      });
      const url = `${API_BASE}?${params.toString()}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const xmlText = await res.text();
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const resultCode = doc.querySelector('resultCode')?.textContent?.trim();
        const resultMsg = doc.querySelector('resultMsg')?.textContent?.trim();
        if (resultCode && resultCode !== '000') {
          throw new Error(`${resultCode} ${resultMsg || 'API 오류'}`);
        }

        const items = Array.from(doc.querySelectorAll('item')).map(item => ({
          aptNm: item.querySelector('aptNm')?.textContent?.trim() || '-',
          aptDong: item.querySelector('aptDong')?.textContent?.trim() || '',
          buildYear: item.querySelector('buildYear')?.textContent?.trim() || '',
          buyerGbn: item.querySelector('buyerGbn')?.textContent?.trim() || '',
          cdealDay: item.querySelector('cdealDay')?.textContent?.trim() || '',
          cdealType: item.querySelector('cdealType')?.textContent?.trim() || '',
          dealAmount: item.querySelector('dealAmount')?.textContent?.trim() || '',
          dealDay: item.querySelector('dealDay')?.textContent?.trim() || '',
          dealMonth: item.querySelector('dealMonth')?.textContent?.trim() || '',
          dealYear: item.querySelector('dealYear')?.textContent?.trim() || '',
          dealingGbn: item.querySelector('dealingGbn')?.textContent?.trim() || '',
          estateAgentSggNm: item.querySelector('estateAgentSggNm')?.textContent?.trim() || '',
          excluUseAr: item.querySelector('excluUseAr')?.textContent?.trim() || '',
          floor: item.querySelector('floor')?.textContent?.trim() || '',
          jibun: item.querySelector('jibun')?.textContent?.trim() || '',
          rgstDate: item.querySelector('rgstDate')?.textContent?.trim() || '',
          sggCd: item.querySelector('sggCd')?.textContent?.trim() || '',
          slerGbn: item.querySelector('slerGbn')?.textContent?.trim() || '',
          umdNm: item.querySelector('umdNm')?.textContent?.trim() || '',
        }));

        state.raw = items;
        applyFilters(dayFilter);
        setStatus(`${selectedRegionName()} ${dealYmd.slice(0,4)}-${dealYmd.slice(4,6)} 조회 완료`, 'ok');
      } catch (err) {
        console.error(err);
        setStatus(`오류: ${err.message}`, 'error');
      }
    }

    function applyFilters(passedDay) {
      const aptKeyword = $('aptSearch').value.trim().toLowerCase();
      const dayVal = typeof passedDay === 'string' ? passedDay : $('dealDay').value;
      const sortBy = $('sortBy').value;

      let filtered = [...state.raw];
      if (dayVal) filtered = filtered.filter(x => String(Number(x.dealDay || 0)) === String(Number(dayVal)));
      if (aptKeyword) filtered = filtered.filter(x => x.aptNm.toLowerCase().includes(aptKeyword));

      const groupedMap = new Map();
      for (const item of filtered) {
        const key = item.aptNm;
        if (!groupedMap.has(key)) groupedMap.set(key, []);
        groupedMap.get(key).push(item);
      }

      let grouped = Array.from(groupedMap.entries()).map(([aptNm, items]) => {
        const sortedItems = items.sort((a,b) => {
          const da = new Date(`${a.dealYear}-${String(a.dealMonth).padStart(2,'0')}-${String(a.dealDay).padStart(2,'0')}`);
          const db = new Date(`${b.dealYear}-${String(b.dealMonth).padStart(2,'0')}-${String(b.dealDay).padStart(2,'0')}`);
          return db - da;
        });
        const prices = sortedItems.map(x => Number(String(x.dealAmount).replace(/,/g,'')) || 0);
        const latest = sortedItems[0];
        return {
          aptNm,
          items: sortedItems,
          count: sortedItems.length,
          maxPrice: Math.max(...prices, 0),
          latestDate: latest ? formatDate(latest.dealYear, latest.dealMonth, latest.dealDay) : '-',
          latestDong: latest?.aptDong || '',
          cancelCount: sortedItems.filter(x => x.cdealType || x.cdealDay).length,
        };
      });

      grouped.sort((a,b) => {
        if (sortBy === 'priceDesc') return b.maxPrice - a.maxPrice;
        if (sortBy === 'priceAsc') return a.maxPrice - b.maxPrice;
        if (sortBy === 'countDesc') return b.count - a.count;
        return (new Date(b.latestDate)) - (new Date(a.latestDate));
      });

      state.filtered = filtered;
      state.grouped = grouped;
      render();
    }

    function render() {
      $('mAptCount').textContent = state.grouped.length.toLocaleString('ko-KR');
      $('mTradeCount').textContent = state.filtered.length.toLocaleString('ko-KR');
      $('mCancelCount').textContent = state.filtered.filter(x => x.cdealType || x.cdealDay).length.toLocaleString('ko-KR');
      updateRegionMetric();

      const root = $('groupList');
      if (!state.grouped.length) {
        root.innerHTML = '<div class="card" style="padding:18px; color:#6b7280;">표시할 데이터가 없습니다.</div>';
        return;
      }

      root.innerHTML = state.grouped.map((g, idx) => {
        const details = g.items.map(item => {
          const cancelled = item.cdealType || item.cdealDay;
          return `
            <tr>
              <td>${formatDate(item.dealYear, item.dealMonth, item.dealDay)}</td>
              <td>${item.aptDong || '-'}</td>
              <td>${item.excluUseAr || '-'}</td>
              <td>${item.floor || '-'}</td>
              <td>
                ${formatMoney(item.dealAmount)} ${cancelled ? '<span class="cancel">(해제)</span>' : ''}
                ${item.cdealDay ? `<div class="small">해제일: ${item.cdealDay}</div>` : ''}
              </td>
              <td>${item.dealingGbn || '-'}</td>
              <td>${item.estateAgentSggNm || '-'}</td>
            </tr>`;
        }).join('');

        return `
          <div class="group ${idx === 0 ? 'open' : ''}">
            <div class="group-head" data-index="${idx}">
              <div class="chev">›</div>
              <div>
                <div class="apt-name">${g.aptNm}</div>
                <div class="small">최신 계약일 ${g.latestDate}${g.latestDong ? ` · ${g.latestDong}` : ''}</div>
              </div>
              <div>
                <div class="small">거래건수</div>
                <div><b>${g.count}</b>건</div>
              </div>
              <div>
                <div class="small">최고 거래가</div>
                <div><b>${g.maxPrice ? g.maxPrice.toLocaleString('ko-KR') : '-'}만원</b></div>
              </div>
              <div>${g.cancelCount ? `<span class="pill">해제 ${g.cancelCount}건</span>` : '<span class="pill">정상</span>'}</div>
            </div>
            <div class="details">
              <table>
                <thead>
                  <tr>
                    <th>계약일</th>
                    <th>동</th>
                    <th>전용면적</th>
                    <th>층</th>
                    <th>거래금액</th>
                    <th>거래유형</th>
                    <th>중개사소재지</th>
                  </tr>
                </thead>
                <tbody>${details}</tbody>
              </table>
            </div>
          </div>`;
      }).join('');

      document.querySelectorAll('.group-head').forEach(el => {
        el.addEventListener('click', () => el.parentElement.classList.toggle('open'));
      });
    }

    function downloadCsv() {
      if (!state.filtered.length) {
        setStatus('다운로드할 데이터가 없습니다.', 'error');
        return;
      }
      const rows = [
        ['단지명','계약일','동','전용면적','층','거래금액','해제여부','해제일','거래유형','중개사소재지']
      ];
      for (const item of state.filtered) {
        rows.push([
          item.aptNm,
          formatDate(item.dealYear, item.dealMonth, item.dealDay),
          item.aptDong || '',
          item.excluUseAr || '',
          item.floor || '',
          item.dealAmount || '',
          (item.cdealType || item.cdealDay) ? '해제' : '정상',
          item.cdealDay || '',
          item.dealingGbn || '',
          item.estateAgentSggNm || ''
        ]);
      }
      const csv = '\uFEFF' + rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'apt_trade.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function initEvents() {
      $('sido').addEventListener('change', populateSigungu);
      $('sigungu').addEventListener('change', updateRegionMetric);
      $('loadBtn').addEventListener('click', loadTrades);
      $('dealDay').addEventListener('change', () => applyFilters());
      $('aptSearch').addEventListener('input', () => applyFilters());
      $('sortBy').addEventListener('change', () => applyFilters());
      $('csvBtn').addEventListener('click', downloadCsv);
    }

    function init() {
      initYmd();
      initDays();
      populateSido();
      initEvents();
      updateRegionMetric();
    }

    init();
  </script>
</body>
</html>
